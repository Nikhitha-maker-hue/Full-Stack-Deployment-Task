databases:
  - name: taskflow-db
    databaseName: taskflow
    user: taskflow_user
    plan: free

services:
  - type: web
    name: taskflow-api
    runtime: node
    plan: free
    rootDir: backend/Task-API-WA2
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
